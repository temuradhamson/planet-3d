<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планета — живой глобус</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="globe"></canvas>
      <div id="labels"></div>

      <header class="hud top-left">
        <div class="brand">
          <span class="orb"></span>
          <div>
            <h1>Планета</h1>
            <p>границы · демография · реальное небо</p>
          </div>
        </div>
      </header>

      <aside class="hud top-right clock" id="clock">
        <div class="k">локальное время <span class="dim">UTC+5</span></div>
        <div class="v" id="clk-local">—</div>
        <div class="row">
          <div>
            <div class="k">UTC</div>
            <div class="v sm" id="clk-utc">—</div>
          </div>
          <div>
            <div class="k">звёздное</div>
            <div class="v sm" id="clk-sidereal">—</div>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="k">Солнце над Ташкентом</div>
            <div class="v sm" id="clk-sun">—</div>
          </div>
          <div>
            <div class="k">Луна</div>
            <div class="v sm" id="clk-moon">—</div>
          </div>
        </div>
      </aside>

      <div class="hud search" id="search-box">
        <input
          id="search"
          type="search"
          placeholder="Найти страну, область, район…"
          autocomplete="off"
        />
        <ul id="search-results" hidden></ul>
      </div>

      <div class="hud bottom-left help">
        <div>ЛКМ — вращать планету</div>
        <div>колёсико / кнопки — зум</div>
        <div>наведение — демография</div>
        <div>клик — приблизить</div>
      </div>

      <div class="hud zoom" id="zoom-btns">
        <button type="button" id="btn-in" title="Приблизить">+</button>
        <button type="button" id="btn-out" title="Отдалить">−</button>
        <button type="button" id="btn-ca" title="Центральная Азия">CA</button>
        <button type="button" id="btn-reset" title="Весь мир">⊕</button>
      </div>

      <div class="hud time-scale">
        <label>ход времени
          <input id="timescale" type="range" min="0" max="4" step="1" value="1" />
        </label>
        <span id="timescale-label">реально</span>
      </div>

      <article class="hud card" id="card" hidden>
        <header>
          <p class="eyebrow" id="card-kind">страна</p>
          <h2 id="card-title">—</h2>
          <p class="sub" id="card-sub"></p>
        </header>
        <dl id="card-stats"></dl>
        <p class="fact" id="card-fact"></p>
      </article>

      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Собираю планету…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
